<style>
  :root {
    --navy: #1A3A5C;
    --navy-dark: #12293F;
    --paper: #F5F7FA;
    --soft: #A0B7D0;
    --line: rgba(245,247,250,.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--navy);
    color: var(--paper);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 620px;
    margin: 0 auto;
    padding: 72px 0 48px;
  }
  .mark { width: 96px; height: 96px; color: var(--paper); }
  h1 {
    font-size: clamp(42px, 11vw, 68px);
    font-weight: 800;
    letter-spacing: .04em;
    margin: 26px 0 0;
    line-height: 1;
  }
  .tagline {
    font-size: clamp(18px, 4.4vw, 22px);
    color: var(--soft);
    margin: 18px 0 0;
    max-width: 24ch;
    text-wrap: balance;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 36px 0 0;
  }
  .badge {
    font-size: 14px;
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
  }
  .soon {
    margin: 40px 0 0;
    font-size: 15px;
    color: var(--soft);
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  footer {
    border-top: 1px solid var(--line);
    padding: 24px 0 calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 14.5px;
    color: var(--soft);
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
  }
  footer a { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--soft); }
  .contato { margin-top: 8px; }
</style>

  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="VITRUK">
